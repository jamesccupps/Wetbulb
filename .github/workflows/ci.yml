name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: nothing here pushes or publishes (Pages builds from the branch).
permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Zero runtime/dev dependencies — nothing to install.
      - run: node --test
